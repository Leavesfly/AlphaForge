# ──────────────────────────────────────────────────────────────
# 事件驱动策略（统一 rules DSL）
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: event_driven
label: 事件驱动
description: 基于重大事件（财报/政策/行业变化）驱动的交易
category: event
risk_level: high

rules:
  parameters:
    event_types: [earnings, policy, industry]
    holding_days: 5

  signal:
    position_size: 0.50
    entry:
      - type: event_trigger
        category: positive
    exit:
      - type: holding_days
        max: 5
      - type: stop_loss
        pct: -5

  score:
    weight: 15
    when:
      - type: event_trigger
        category: positive
    conditions:
      event_freshness_days: 3
