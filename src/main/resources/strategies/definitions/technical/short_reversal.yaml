# ──────────────────────────────────────────────────────────────
# 短期反转（ClassicFactorLibrary.reversal_5）
# A 股短期反转效应：买入近 5 日跌幅较大的标的，等待均值修复
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: short_reversal
label: 短期反转
description: 基于 5 日反转因子，买入近期超跌标的，短持等待反弹
category: technical
risk_level: medium
applicable_market: [range, bear]
applicable_cap: [mid, small]
tags: [反转, 因子, 超跌, 短线]

rules:
  parameters:
    hold_days: 5
  param_space:
    hold_days: [3, 5, 8]

  signal:
    position_size: 0.70
    entry:
      # reversal_5 = -momentum_5，值越高表示近 5 日跌幅越大
      - type: factor
        name: reversal_5
        min: 0.05
      - type: factor
        name: volatility_20
        max: 0.05
    exit:
      - type: factor
        name: reversal_5
        max: 0.0
      - type: stop_loss
        pct: -8
      - type: take_profit
        pct: 10
      - type: holding_days
        max: 5

  score:
    weight: 12
    when:
      - type: factor
        name: reversal_5
        min: 0.05
      - type: factor
        name: volatility_20
        max: 0.05

  rank:
    parameters:
      cross_section_factors: [reversal_5]
    scoring_rules:
      - when: factor_rank_gte
        factor: reversal_5
        threshold: 0.7
        formula: "50 + factor_rank * 45"
      - when: change_pct_lt
        threshold: -8
        formula: "70 + change_pct * -2"
      - when: change_pct_lt
        threshold: -3
        formula: "45 + change_pct * -3"
    reason_templates:
      high: 短期超跌反转
      low: 跌幅偏大待修复
