# ──────────────────────────────────────────────────────────────
# 通道突破（海龟交易法则近似）
# N 日高点突破开仓，M 日低点跌破或 ATR 止损平仓
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: channel_breakout
label: 通道突破
description: 价格突破 N 日通道上沿做多，跌破退出通道或触发 ATR 止损离场
category: technical
risk_level: high
applicable_market: [bull]
applicable_cap: [mid, small]
tags: [趋势, 海龟, 通道突破, ATR, 中线]

rules:
  parameters:
    entry_channel: 20
    exit_channel: 10
    atr_period: 20
    atr_multiplier: 2.0
  param_space:
    entry_channel: [10, 20, 55]
    exit_channel: [5, 10, 20]
    atr_multiplier: [1.5, 2.0, 3.0]
  # ATR 风险预算仓位：单笔风险约 1% 资金，上限 80%
  position_sizing:
    mode: atr
    risk_fraction: 0.01
    atr_period: 20
    atr_multiplier: 2.0

  signal:
    position_size: 0.80
    entry:
      - type: channel_breakout
        lookback: 20
    exit:
      - type: channel_breakdown
        lookback: 10
      - type: atr_stop
        period: 20
        multiplier: 2.0
      - type: stop_loss
        pct: -12

  score:
    weight: 14
    when:
      - type: channel_breakout
        lookback: 20
      - type: factor
        name: momentum_20
        min: 0.02
