# ──────────────────────────────────────────────────────────────
# 波浪理论策略（统一 rules DSL）
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: wave_theory
label: 波浪理论
description: 基于艾略特波浪理论判断浪型位置
category: technical
risk_level: medium

rules:
  parameters:
    wave_lookback: 60

  signal:
    position_size: 0.70
    entry:
      - type: wave_position
        target: wave_3_start
    exit:
      - type: wave_position
        target: wave_5_end
      - type: stop_loss
        pct: -10

  score:
    weight: 10
    conditions:
      wave_position: wave3_start
      fibonacci_support: true
