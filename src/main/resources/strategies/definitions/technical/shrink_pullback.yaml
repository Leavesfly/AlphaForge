# ──────────────────────────────────────────────────────────────
# 缩量回调策略（统一 rules DSL）
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: shrink_pullback
label: 缩量回调
description: 上升趋势中缩量回调至支撑位附近买入
category: technical
risk_level: medium
applicable_market: [bull, recovery]
applicable_cap: [large, mid, small]
tags: [回调, 缩量, 支撑, 趋势]

rules:
  parameters:
    trend_ma: 60
    support_ma: 20
    volume_shrink_ratio: 0.5
  position_sizing:
    mode: atr
    risk_fraction: 0.01
    atr_period: 20
    atr_multiplier: 2.0

  signal:
    position_size: 0.85
    entry:
      - type: trend_above
        ma: 60
      - type: pullback_to
        ma: 20
      - type: volume_shrink
        ratio: 0.5
    exit:
      - type: price_below_ma
        ma: 60
      - type: atr_stop
        period: 20
        multiplier: 2.0
      - type: stop_loss
        pct: -7

  score:
    weight: 16
    when:
      - type: trend_above
      - type: volume_shrink
        ratio: 0.6
    conditions:
      pullback_days_max: 5
