# ──────────────────────────────────────────────────────────────
# 牛趋势策略（统一 rules DSL）
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: bull_trend
label: 牛趋势
description: 股价在 MA10 和 MA30 之上持有，跌破 MA30 清仓
category: technical
risk_level: medium

rules:
  parameters:
    short_ma: 10
    long_ma: 30
  position_sizing:
    mode: atr
    risk_fraction: 0.015
    atr_period: 20
    atr_multiplier: 2.0

  signal:
    position_size: 0.90
    entry:
      - type: price_above_ma
        ma: [10, 30]
      - type: ma_arrangement
        direction: bullish
    exit:
      - type: price_below_ma
        ma: 30
      - type: atr_stop
        period: 20
        multiplier: 2.5

  score:
    weight: 20
    when:
      - type: ma_arrangement
        direction: bullish
    conditions:
      min_days: 5
      pullback_max_pct: 5
