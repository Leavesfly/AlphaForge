# ──────────────────────────────────────────────────────────────
# 动量策略（统一 rules DSL 试点）
# signal → 回测 | rank → 选股打分
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: momentum
label: 动量策略
description: 近期涨幅强势的标的筛选
category: technical
risk_level: high
applicable_market: [bull, range]
applicable_cap: [mid, small]
tags: [动量, 涨幅, 强势, 短线]

rules:
  parameters:
    strong_change_pct: 1.5
  param_space:
    strong_change_pct: [1.0, 1.5, 2.0, 3.0]

  signal:
    position_size: 0.70
    entry:
      - type: momentum_up
        min_change: 1.5
    exit:
      - type: change_below
        pct: -3
      - type: stop_loss
        pct: -8
      - type: take_profit
        pct: 12
      - type: holding_days
        max: 5

  rank:
    scoring_rules:
      - when: change_pct_gt
        threshold: 1.5
        formula: "50 + change_pct * 8"
      - when: change_pct_gt
        threshold: 0
        formula: "30 + change_pct * 12"
    reason_templates:
      high: 强势突破
      low: 趋势向好
