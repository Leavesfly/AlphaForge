# ──────────────────────────────────────────────────────────────
# 箱体震荡策略（统一 rules DSL）
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: box_oscillation
label: 箱体震荡
description: 识别箱体整理形态，在箱体下沿买入、上沿卖出
category: technical
risk_level: low

rules:
  parameters:
    lookback_days: 20
    box_threshold_pct: 10

  signal:
    position_size: 0.70
    entry:
      - type: near_box_low
        tolerance_pct: 2
    exit:
      - type: near_box_high
        tolerance_pct: 2
      - type: box_break_down
        pct: -3

  score:
    weight: 10
    conditions:
      range_days: 20
      amplitude_max_pct: 15
      breakout_volume_ratio: 1.8
