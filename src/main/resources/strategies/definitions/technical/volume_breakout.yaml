# ──────────────────────────────────────────────────────────────
# 放量突破策略（统一 rules DSL 试点）
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: volume_breakout
label: 放量突破
description: 成交量超过 20 日均量 2 倍且涨幅 > 3% 时买入
category: technical
risk_level: high
applicable_market: [bull, range]
applicable_cap: [mid, small]
tags: [突破, 放量, 动量, 短线]

rules:
  parameters:
    volume_multiple: 2.0
    min_change_pct: 3.0
    ma_period: 20
  param_space:
    volume_multiple: [1.5, 2.0, 2.5, 3.0]
    min_change_pct: [2.0, 3.0, 4.0]
  position_sizing:
    mode: atr
    risk_fraction: 0.012
    atr_period: 14
    atr_multiplier: 2.0

  signal:
    position_size: 0.80
    entry:
      - type: volume_breakout
        multiple: 2.0
        min_change: 3.0
    exit:
      - type: change_below
        pct: -5
      - type: atr_stop
        period: 14
        multiplier: 2.0
      - type: stop_loss
        pct: -10
      - type: take_profit
        pct: 15

  score:
    weight: 18
    # 突破类评分仍保留扁平 key（含阻力位语义，暂无单一 type 覆盖）
    conditions:
      breakout_resistance: true
      volume_ratio_min: 2.0
      close_above_resistance: true
