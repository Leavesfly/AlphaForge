# ──────────────────────────────────────────────────────────────
# 均线金叉策略（统一 rules DSL）
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: ma_golden_cross
label: 均线金叉
description: MA5 上穿 MA20 形成金叉时买入，MA5 下穿 MA20 死叉时卖出
category: technical
risk_level: medium
applicable_market: [bull, recovery]
applicable_cap: [large, mid, small]
tags: [趋势, 均线, 金叉, 中线]

rules:
  parameters:
    fast_period: 5
    slow_period: 20
  param_space:
    fast_period: [3, 5, 8, 10]
    slow_period: [15, 20, 30, 60]
  position_sizing:
    mode: atr
    risk_fraction: 0.01
    atr_period: 20
    atr_multiplier: 2.0

  signal:
    position_size: 0.95
    entry:
      - type: ma_cross
        fast: MA5
        slow: MA20
        direction: golden
    exit:
      - type: ma_cross
        fast: MA5
        slow: MA20
        direction: death
      - type: atr_stop
        period: 20
        multiplier: 2.0
      - type: stop_loss
        pct: -8
