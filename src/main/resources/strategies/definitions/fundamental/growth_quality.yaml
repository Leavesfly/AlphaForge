# ──────────────────────────────────────────────────────────────
# 成长质量策略（统一 rules DSL）
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: growth_quality
label: 成长质量
description: 选择高成长 + 高质量的中长线标的
category: fundamental
risk_level: low

rules:
  parameters:
    min_revenue_growth: 20
    min_roe: 15
    max_pe: 50

  signal:
    position_size: 0.80
    entry:
      - type: fundamental_filter
        revenue_growth_min: 20
        roe_min: 15
      - type: price_near_support
    exit:
      - type: fundamental_deterioration
      - type: stop_loss
        pct: -15

  score:
    weight: 15
    when:
      - type: fundamental_filter
        revenue_growth_min: 20
        roe_min: 15
    conditions:
      profit_growth_min: 25
