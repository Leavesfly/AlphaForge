# ──────────────────────────────────────────────────────────────
# 高股息策略（统一 rules DSL）
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: dividend
label: 高股息
description: 股息率 > 3% 的稳健分红标的
category: fundamental
risk_level: low
applicable_market: [all]
applicable_cap: [large, mid]
tags: [股息, 分红, 稳健, 长线]

rules:
  parameters:
    lookback_days: 60
    max_amplitude_pct: 20
    support_ma: 60
  param_space:
    max_amplitude_pct: [15, 20, 25]
    lookback_days: [40, 60, 90]

  signal:
    position_size: 0.90
    entry:
      - type: amplitude_below
        lookback: 60
        max_pct: 20
      - type: price_near_support
        tolerance_pct: 3.0
      - type: price_above_ma
        ma: 60
    exit:
      - type: break_below_ma
        ma: 60
      - type: stop_loss
        pct: -10
      - type: take_profit
        pct: 20

  rank:
    parameters:
      min_dividend_yield: 3
    scoring_rules:
      - metric: dividend_yield
        operator: gt
        threshold: 3
        weight: 15
    reason_templates:
      high: 高股息稳健标的
      low: 分红较好
    fallback:
      metrics: [dividend_yield]
      score_min: 35
      score_max: 75
