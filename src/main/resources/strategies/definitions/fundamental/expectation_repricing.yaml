# ──────────────────────────────────────────────────────────────
# 预期重定价策略（统一 rules DSL）
# 缺 EPS/分析师历史时，用事件触发 + 放量突破代理「预期上修」
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: expectation_repricing
label: 预期重定价
description: 基本面预期发生重大变化导致估值重估
category: fundamental
risk_level: medium
applicable_market: [bull, recovery]
applicable_cap: [large, mid]
tags: [预期, 重定价, 事件, 中线]

rules:
  parameters:
    volume_multiple: 1.8
    min_change_pct: 5.0
    ma_period: 20
  param_space:
    min_change_pct: [4.0, 5.0, 6.0]
    volume_multiple: [1.5, 1.8, 2.0]

  signal:
    position_size: 0.75
    entry:
      - type: event_trigger
        category: positive
        min_change: 5.0
      - type: volume_breakout
        multiple: 1.8
        min_change: 5.0
    exit:
      - type: stop_loss
        pct: -12
      - type: take_profit
        pct: 25
      - type: change_below
        pct: -6
      - type: holding_days
        max: 20

  score:
    weight: 12
    # 与 signal 对齐：缺 EPS/分析师字段时用事件触发 + 放量突破代理
    when:
      - type: event_trigger
        category: positive
        min_change: 5.0
      - type: volume_breakout
        multiple: 1.8
        min_change: 5.0
