# ──────────────────────────────────────────────────────────────
# 双低策略（统一 rules DSL）
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: dual_low
label: 双低策略
description: 低 PE + 低 PB 的价值标的筛选
category: fundamental
risk_level: low
applicable_market: [all]
applicable_cap: [large, mid]
tags: [价值, 低估值, PE, PB, 长线]

rules:
  parameters:
    max_pe: 15
    lookback_days: 20
    max_amplitude_pct: 25
    support_ma: 60
  param_space:
    max_pe: [12, 15, 20]
    max_amplitude_pct: [20, 25, 30]

  signal:
    position_size: 0.85
    entry:
      - type: fundamental_filter
        max_pe: 15
      - type: amplitude_below
        lookback: 20
        max_pct: 25
      - type: price_near_support
        tolerance_pct: 3.0
    exit:
      - type: fundamental_deterioration
      - type: stop_loss
        pct: -12
      - type: take_profit
        pct: 30

  rank:
    parameters:
      pe_max: 15
      pb_max: 2
    scoring_rules:
      - metric: pe
        operator: lt
        threshold: 15
        weight: 3
      - metric: pb
        operator: lt
        threshold: 2
        weight: 20
    reason_templates:
      high: 低估值优质标的
      low: 估值偏低
    fallback:
      metrics: [pe, pb]
      score_min: 40
      score_max: 85
