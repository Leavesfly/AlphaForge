# ──────────────────────────────────────────────────────────────
# 情绪周期策略（统一 rules DSL）
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: emotion_cycle
label: 情绪周期
description: 跟踪市场情绪周期高低点做反向操作
category: sentiment
risk_level: medium

rules:
  parameters:
    sentiment_period: 20
    oversold_threshold: 20
    overbought_threshold: 80

  signal:
    position_size: 0.60
    entry:
      - type: sentiment_extreme
        level: oversold
    exit:
      - type: sentiment_extreme
        level: overbought
      - type: stop_loss
        pct: -7

  score:
    weight: 10
    conditions:
      cycle_phase: recovery
      sentiment_score_min: -50
