# ──────────────────────────────────────────────────────────────
# 龙头战法策略（统一 rules DSL）
# ──────────────────────────────────────────────────────────────
schema_version: 1
id: dragon_head
label: 龙头战法
description: 识别板块龙头股首阴或缩量回调买入
category: sentiment
risk_level: high
applicable_market: [bull, range]
applicable_cap: [mid, small]
tags: [龙头, 涨停, 板块, 热点, 短线]

rules:
  parameters:
    min_consec_up_days: 3
    pullback_pct: -3

  signal:
    position_size: 0.50
    entry:
      - type: consecutive_up
        days: 3
      - type: first_pullback
        max_pct: -5
    exit:
      - type: break_below_ma
        ma: 5
      - type: stop_loss
        pct: -8

  score:
    label: 龙头首板
    weight: 18
    conditions:
      limit_up: true
      is_sector_leader: true
      turnover_ratio_min: 5
