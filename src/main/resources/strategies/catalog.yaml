# ──────────────────────────────────────────────────────────────
# 策略总目录（catalog）
#
# 加载顺序：本文件 → definitions/{category}/{id}.yaml
# 定义格式：统一 rules DSL（signal / score / rank）
#   rules.signal → BacktestSignalEngine（历史回测）
#   rules.score  → CompositeScoringEngine（综合评分）
#   rules.rank   → ScreeningScoreEngine（智能选股）
# 能力标识仍用 backtest / scoring / screening（与引擎 API 对齐）
# ──────────────────────────────────────────────────────────────
schema_version: 1

# 能力说明
capabilities:
  backtest: 历史回测（rules.signal → 入场/出场信号）
  screening: 智能选股（rules.rank → AlphaSift 打分）
  scoring: 综合分析（rules.score → 多策略加权）

# 策略分类（中文标签）
categories:
  technical: 技术面
  fundamental: 基本面
  sentiment: 情绪面
  event: 事件驱动

# runtime 状态说明：
#   implemented — 引擎已完整支持 YAML 中定义的条件
#   partial     — 部分条件类型尚未实现（如 wave_position、sentiment_extreme）
#   planned     — 仅配置定义，引擎尚未实现
strategies:
  # ── 回测策略 ──────────────────────────────────────────────
  ma_golden_cross:
    file: definitions/technical/ma_golden_cross.yaml
    capabilities: [backtest]
    runtime: implemented

  volume_breakout:
